{% extends "base.html" %}

{% block title %}Page Not Found - PrajaConnectAI{% endblock %}

{% block content %}
<div class="section-card" style="text-align: center; padding: 60px 20px; max-width: 600px; margin: 40px auto;">
    <div style="font-size: 4rem; color: var(--primary); margin-bottom: 12px;">
        <i class="bi bi-compass"></i>
    </div>
    <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 8px;">404 - Page Not Found</h1>
    <p style="color: var(--text-muted); margin-bottom: 24px;">{{ message or "The requested page could not be found." }}</p>
    <a href="/" class="btn-card-action btn-solid-primary" style="padding: 12px 24px;">
        <i class="bi bi-house-door-fill"></i> Return to Home Page
    </a>
</div>
{% endblock %}
